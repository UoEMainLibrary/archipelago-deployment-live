upstream cantaloupe {
  server esmero-cantaloupe:8182;
}

server {
    listen              80;
    server_name         localhost;
    #ssl_certificate     /etc/letsencrypt/live/${FQDN}/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/${FQDN}/privkey.pem;
    client_max_body_size 1536M; ## Match with PHP from FPM container

    set_real_ip_from 10.64.94.1/32;
    set_real_ip_from 10.64.94.2/32;
    set_real_ip_from 10.64.94.3/32;
    set_real_ip_from 129.215.217.3/32;

    real_ip_header    NS-X-Forwarded-For;

    # SR -- access config 29-05-26.

    # We will bring this back, and more, after go live....
    # Specific IP blocks- Amazon
    #deny 47.128.116.0/24;
    #allow all;

    #.... but while we have the luxury of only being "soft-launched"
    # we can go Edinburgh-only so the migration isn't interrupted by bots.

    allow 127.0.0.1;
    allow ::1;

    allow 10.0.0.0/8;
    allow 172.16.0.0/12;

    allow 192.168.0.0/16;

    allow 129.215.0.0/16;

    deny all;

    root /var/www/html/web; ## <-- Your only path reference.

    if ($http_user_agent ~* (go\-http|zgrab|mj12bot|meta\-externalagent|oai\-searchbot|tiktok|tiktokspider|lplinkcheck|netcrawl|npbot|AliyunSecBot|bytedance|bytespider|gptbot|semrush|petalbot|amazonbot|ahrefsbot|zhanzhang|semrushbot|brightbot|imagesiftbot|barkrowler|friendlycrawler|turnitin|claudebot|aiohttp|semanticscholarbot|go\-http\-client|facebookexternalhit)) {
          return 444;
    }

    fastcgi_send_timeout 120s;
    fastcgi_read_timeout 120s;
    fastcgi_pass_request_headers on;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    # Please adapt to your needs
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;

    include /etc/nginx/conf.d/bots.include;

    #gzip
    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
      application/atom+xml
      application/geo+json
      application/javascript
      application/x-javascript
      application/json
      application/ld+json
      application/manifest+json
      application/rdf+xml
      application/rss+xml
      application/xhtml+xml
      application/xml
      font/eot
      font/otf
      font/ttf
      image/svg+xml
      text/css
      text/javascript
      text/plain
      text/xml;

    # Cantaloupe proxypass
    # location /cantaloupe/ {
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   proxy_set_header X-Forwarded-Host $host;
    #   proxy_set_header X-Forwarded-Port $server_port;
    #   proxy_set_header X-Forwarded-Path /cantaloupe/;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   if ($request_uri ~* "/cantaloupe/(.*)") {
    #     proxy_pass http://cantaloupe/$1;
    #   }
    # }

    # Cantaloupe proxypass
    location /cantaloupe/ {
       # SR 2025-11-05 replace $scheme with $http_ns_x_forwarded_proto
       proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
       proxy_set_header X-Forwarded-Host $host;
       #proxy_set_header X-Forwarded-Port 443;
       proxy_set_header X-Forwarded-Path /cantaloupe/;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       if ($request_uri ~* "^/cantaloupe/iiif/(1||2||3)/(.{3})/(.*)$") {
         proxy_pass http://cantaloupe/iiif/$1/$2%2F$3;
         break;
       }
       if ($request_uri ~* "/cantaloupe/(.*)") {
         proxy_pass http://cantaloupe/$1;
       }
    }

   location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Very rarely should these ever be accessed outside of your lan
    location ~* \.(txt|log)$ {
        deny all;
    }

    location ~ \..*/.*\.php$ {
        return 403;
    }

    location ~ ^/sites/.*/private/ {
        return 403;
    }

    # Allow "Well-Known URIs" as per RFC 5785
    location ~* ^/.well-known/ {
        allow all;
    }

    # Block access to "hidden" files and directories whose names begin with a
    # period. This includes directories used by version control systems such
    # as Subversion or Git to store control files.
    location ~ (^|/)\. {
        return 403;
    }

    location / {
        try_files $uri /index.php?$query_string; # For Drupal >= 7
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?q=$1;
    }

    # Don't allow direct access to PHP files in the vendor directory.
    location ~ /vendor/.*\.php$ {
        deny all;
        return 404;
    }

    # Allow Modules to be updated via UI (still we believe composer is the way)
    rewrite ^/core/authorize.php/core/authorize.php(.*)$ /core/authorize.php$1;

    # In Drupal 8, we must also match new paths where the '.php' appears in
    # the middle, such as update.php/selection. The rule we use is strict,
    # and only allows this pattern with the update.php front controller.
    # This allows legacy path aliases in the form of
    # blog/index.php/legacy-path to continue to route to Drupal nodes. If
    # you do not have any paths like that, then you might prefer to use a
    # laxer rule, such as:
    #   location ~ \.php(/|$) {
    # The laxer rule will continue to work if Drupal uses this new URL
    # pattern with front controllers other than update.php in a future
    # release.
    location ~ '\.php$|^/update.php' {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        include fastcgi_params;
        # Block httpoxy attacks. See https://httpoxy.org/.
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PHP_VALUE "upload_max_filesize=1536M \n post_max_size=1536M";
        proxy_read_timeout 900s;
        fastcgi_intercept_errors on;
        fastcgi_pass esmero-php:9000;
    }

     # Fighting with Styles? This little gem is amazing.
    location ~ ^/sites/.*/files/styles/ { # For Drupal >= 7
        try_files $uri @rewrite;
    }

    # Handle private files through Drupal.
    location ~ ^/system/files/ { # For Drupal >= 7
        try_files $uri /index.php?$query_string;
    }
    # Enforce clean URLs
    # Removes index.php from urls like www.example.com/index.php/my-page --> www.example.com/my-page
    # Could be done with 301 for permanent or other redirect codes.
    if ($request_uri ~* "^(.*/)index\.php/(.*)") {
        return 307 $1$2;
    }
}
